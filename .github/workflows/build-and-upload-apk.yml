name: Build and upload APK (robust)

on:
  push:
    branches: [ dev/replace-all ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Ensure ANDROID_SDK_ROOT exists
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Android command-line tools
        run: |
          set -e
          curl -sSLo /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q /tmp/commandlinetools.zip -d /tmp/cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest"

      - name: Install SDK packages (platform-tools, platforms, build-tools)
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          sdkmanager --list --sdk_root="$ANDROID_SDK_ROOT" || true

      - name: Accept Android SDK licenses
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_SDK_ROOT" || true

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew || true

      - name: Show Java and SDK info
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT || true

      - name: Build Debug APK (with verbose logs)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace |& tee gradle-output.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubz-os-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk

      - name: Upload Gradle output log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output-log
          path: gradle-output.log
